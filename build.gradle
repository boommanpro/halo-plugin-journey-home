plugins {
    id 'java'
    id "io.freefair.lombok" version "9.2.0"
    id "run.halo.plugin.devtools" version "0.6.2"
}

group 'run.halo.journeyhome'

repositories {
    maven {
        name = 'Central Portal Snapshots'
        url = 'https://central.sonatype.com/repository/maven-snapshots/'
        content {
            includeGroupAndSubgroups('run.halo')
        }
    }
    mavenCentral()
}

dependencies {
    implementation platform('run.halo.tools.platform:plugin:2.25.0')
    compileOnly 'run.halo.app:api'
    testImplementation 'run.halo.app:api'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

tasks.register('pnpmInstall', Exec) {
    workingDir = file("${rootDir}/ui")
    commandLine 'pnpm', 'install', '--prefer-offline', '--no-frozen-lockfile'
    standardOutput = new ByteArrayOutputStream()
    errorOutput = standardOutput
    ignoreExitValue = false
}

tasks.register('pnpmBuild', Exec) {
    workingDir = file("${rootDir}/ui")
    commandLine 'pnpm', 'run', 'build'
    standardOutput = new ByteArrayOutputStream()
    errorOutput = standardOutput
    ignoreExitValue = false
    dependsOn 'pnpmInstall'
}

tasks.register('processUiResources') {
    dependsOn 'pnpmBuild'
    doLast {
        copy {
            from "${buildDir}/resources/main/console"
            into "${buildDir}/classes/java/main/console"
        }
    }
}

tasks.register('frontendInstall', Exec) {
    workingDir = file("${rootDir}/frontend")
    commandLine 'pnpm', 'install', '--prefer-offline', '--no-frozen-lockfile'
    ignoreExitValue = false
}

tasks.register('frontendBuild', Exec) {
    workingDir = file("${rootDir}/frontend")
    commandLine 'pnpm', 'run', 'build'
    ignoreExitValue = false
    dependsOn 'frontendInstall'
}

tasks.register('processStreetResources') {
    dependsOn 'frontendBuild'
    doLast {
        copy {
            from "${rootDir}/frontend/dist"
            into "${buildDir}/resources/main/static"
        }
        copy {
            from "${rootDir}/frontend/dist"
            into "${buildDir}/classes/java/main/static"
        }
    }
}

tasks.named('classes') {
    dependsOn tasks.named('processUiResources'), tasks.named('processStreetResources')
}

tasks.named('generatePluginComponentsIdx') {
    notCompatibleWithConfigurationCache('This task invokes "Task.project" at execution time, which is not supported with configuration cache.')
}

halo {
    version = '2.25.0'
    port = 8090
    superAdminUsername = 'admin'
    superAdminPassword = 'admin'
}

haloPlugin {
    openApi {
        groupingRules {
            extensionApis {
                displayName = 'Extension API for journey-home'
                pathsToMatch = [
                    '/apis/console.api.journey-home.halo.run/v1alpha1/**'
                ]
            }
        }
        groupedApiMappings = [
            '/v3/api-docs/extensionApis': 'extensionApis.json'
        ]
    }
}
